const SIGS = [
 {n:5,name:"海邊路 × 青年二路",how:"起點，計程車在這裡下車",q:"海邊路 青年二路 高雄"},
 {n:4,name:"海邊路 × 英雄路",how:"沿海邊路往北走約 5 分",q:"海邊路 英雄路 高雄"},
 {n:3,name:"五福四路 × 河東路",how:"往西北走約 8 分，到愛河東岸",q:"五福四路 河東路 高雄"},
 {n:2,name:"公園二路 × 五福四路",how:"走五福四路過高雄橋，約 5 分",q:"公園二路 五福四路 高雄"},
 {n:1,name:"公園二路 × 大勇路",how:"沿公園二路往西約 10 分，終點，旁邊就是鹽埕埔站",q:"公園二路 大勇路 高雄"}
];

const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let done = store.get("khh-done",{});
let tab = store.get("khh-tab","d1");
let who = store.get("khh-who","all");

function taipeiNow(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
const hm = t => t.slice(11,16);
const visible = s => who==="all" || s.who==="both" || s.who===who;
const tagOf = w => w==="both"?'<span class="tag t-both">一起</span>':w==="me"?'<span class="tag t-me">只有我</span>':'<span class="tag t-mom">只有媽媽</span>';
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function currentId(list){
  const now = taipeiNow(); let cur=null;
  list.filter(s=>s.id && visible(s)).sort((a,b)=>a.t<b.t?-1:1).forEach(s=>{ if(s.t<=now) cur=s.id; });
  return cur;
}

function foodHTML(f){
  const row=(x,label)=>`<div class="row"><span class="lbl">${label}</span><span class="name">${esc(x.n)} <a href="${gm(x.q)}" target="_blank" rel="noopener">導航 ↗</a></span><span class="why">${esc(x.w)}</span></div>`;
  return `<div class="food"><span class="lbl">${esc(f.lbl)}</span>${row(f.main,"主推")}${row(f.alt,"備案")}</div>`;
}

function stopHTML(s,cur){
  const c = !!done[s.id];
  return `<article class="stop${s.id===cur?" current":""}${c?" done":""}" id="stop-${s.id}">
    <div class="stop-head">
      <span class="time">${hm(s.t)}</span>
      <div class="stop-title"><h3>${esc(s.title)}</h3><div class="tags">${tagOf(s.who)}${s.fk?'<span class="tag t-me">藤井風應援</span>':""}${s.id===cur?'<span class="tag t-both">現在</span>':""}</div></div>
      <input type="checkbox" class="check" id="chk-${s.id}" data-id="${s.id}" ${c?"checked":""} aria-label="完成：${esc(s.title)}">
    </div>
    ${s.place?`<div class="place">📍 ${esc(s.place)}${s.map?` <a href="${gm(s.map)}" target="_blank" rel="noopener">Google 地圖 ↗</a>`:""}</div>`:""}
    ${s.desc?`<p class="desc">${esc(s.desc)}</p>`:""}
    ${s.note?`<div class="note">${esc(s.note)}</div>`:""}
    ${s.food?foodHTML(s.food):""}
    ${s.rain?`<details><summary>下雨怎麼辦</summary><p>${esc(s.rain)}</p></details>`:""}
  </article>`;
}
function legHTML(l){return `<div class="leg${l.walk?" walk":""}"><span class="mins">${esc(l.mins)}</span><span>${esc(l.how)}</span></div>`}

function renderDay(list){
  const cur = currentId(list);
  let out='<div class="route">';
  if(list===D1){
    const common = list.filter(s=>s.id && s.who==="both");
    const me = list.filter(s=>s.who==="me"), mom = list.filter(s=>s.who==="mom");
    const block = arr => arr.map(s=>stopHTML(s,cur)+(s.leg?legHTML(s.leg):"")).join("");
    out += block(common);
    if(who!=="mom") out += `<div class="split" style="color:var(--signal)">15:10 起 · 我去演唱會</div>`+block(me);
    if(who!=="me") out += `<div class="split">15:10 起 · 媽媽自由行動</div>`+block(mom);
  } else {
    const arr = list.filter(s=>s.id && visible(s));
    out += arr.map((s,i)=>stopHTML(s,cur)+(s.leg&&i<arr.length-1?legHTML(s.leg):"")).join("");
  }
  return out+'</div>';
}

const FK = [
 {n:"01",name:"電視牆壁貼",when:"10/5–11/4",where:"捷運巨蛋站 2 號出口",plan:"11/1 14:40 回程順路拍"},
 {n:"02",name:"月台玻璃貼",when:"10/5–11/4",where:"捷運巨蛋站（往小港月台）",plan:"11/1 14:40 回程順路拍"},
 {n:"03",name:"歡迎打卡背板＆夜市商圈優惠券",when:"10/30–10/31",where:"捷運左營站",plan:"10/31 11:05 下高鐵就拍，優惠券宵夜用"},
 {n:"04",name:"藤井風獻聲捷運廣播",when:"10/17–10/31",where:"全線月台，車廂廣播在三多商圈、後驛、生態園區、世運、鹽埕埔、文化中心",plan:"10/31 15:10 鹽埕埔上車、世運下車時留意聽"},
 {n:"05",name:"主題行人號誌燈",when:"10/26–10/31",where:"5 個路口共 18 面",plan:"10/31 14:20 從 ⑤ 走到 ①（清單在下面）"},
 {n:"06",name:"未公開驚喜",when:"10/31",where:"演唱會現場",plan:"10/31 到場揭曉"}
];
function renderSig(){
  const got = SIGS.filter(s=>done["sig"+s.n]).length;
  const fkGot = FK.filter(f=>done["fk"+f.n]).length;
  return `<div class="signals">
    <div class="progress">應援項目 ${fkGot} / 6</div>
    ${FK.map(f=>`<div class="sig${done["fk"+f.n]?" got":""}">
      <span class="num" style="font-size:.78rem">${f.n}</span>
      <div class="txt"><b>${esc(f.name)}</b><span>${esc(f.when)} · ${esc(f.where)}</span><br><span style="color:var(--harbor);font-weight:700">→ ${esc(f.plan)}</span></div>
      <input type="checkbox" class="check" id="chk-fk${f.n}" data-id="fk${f.n}" ${done["fk"+f.n]?"checked":""} aria-label="完成 ${esc(f.name)}">
    </div>`).join("")}
    <div class="split" style="color:var(--signal)">行人號誌路口 ⑤ → ①</div>
    <div class="note">官方應援，展示到 <b>10/31</b>，11/1 可能已撤掉，所以排在 10/31 下午踩完。</div>
    <div class="progress">已踩 ${got} / 5</div>
    ${SIGS.map(s=>`<div class="sig${done["sig"+s.n]?" got":""}">
      <span class="num">${s.n}</span>
      <div class="txt"><b>${esc(s.name)}</b><span>${esc(s.how)}</span> <a href="${gm(s.q)}" target="_blank" rel="noopener" style="color:var(--harbor);font-weight:700;text-decoration:none;font-size:.82rem">導航 ↗</a></div>
      <input type="checkbox" class="check" id="chk-sig${s.n}" data-id="sig${s.n}" ${done["sig"+s.n]?"checked":""} aria-label="已踩 ${esc(s.name)}">
    </div>`).join("")}
    <div class="note">拍照時站在人行道上，不要跨進車道。</div>
  </div>`;
}

function renderNow(){
  const now = taipeiNow(); const el=document.getElementById("now");
  const all=[...D1,...D2].filter(s=>s.id && visible(s)).sort((a,b)=>a.t<b.t?-1:1);
  if(now < all[0].t){
    const days = Math.ceil((new Date(all[0].t+"+08:00") - new Date())/86400000);
    el.innerHTML=`<small>出發倒數</small><b>還有 ${days} 天</b><span class="next">10/31 09:30 台北高鐵出發，11:05 到左營</span>`; return;
  }
  let cur=null,next=null; all.forEach(s=>{ if(s.t<=now) cur=s; else if(!next) next=s; });
  if(!next && now>"2026-11-01T17:00"){ el.innerHTML=`<small>行程結束</small><b>平安回家 🚄</b>`; return; }
  el.innerHTML=`<small>現在該做什麼 · ${hm(now)}</small><b>${esc(cur.title)}</b>${next?`<span class="next">下一站 ${hm(next.t)}　${esc(next.title)}</span>`:""}`;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab));
  document.querySelectorAll(".who button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.who===who));
  document.getElementById("whoBar").hidden = tab==="sig";
  document.getElementById("view").innerHTML = tab==="d1"?renderDay(D1):tab==="d2"?renderDay(D2):renderSig();
  renderNow();
}

document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;store.set("khh-tab",tab);render();window.scrollTo({top:0})});
document.getElementById("whoBar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;who=b.dataset.who;store.set("khh-who",who);render()});
document.getElementById("view").addEventListener("change",e=>{const id=e.target.dataset.id;if(!id)return;done[id]=e.target.checked;store.set("khh-done",done);render()});

// open the right day automatically during the trip
(function(){const n=taipeiNow(); if(n>="2026-11-01T00:00"&&n<"2026-11-02") tab="d2"; else if(n>="2026-10-31T00:00"&&n<"2026-11-01"&&tab==="d2") tab="d1";})();
render();
setInterval(renderNow,60000);
</script>
